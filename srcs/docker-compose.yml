services:
  mariadb:
    image: incep_mariadb
    container_name: mariadb
    # image: mariadb #this will download offical mriadb for docker hub
    build: ./requirements/mariadb # means Go into requirements/mariadb/ and build the image using the Dockerfile found there.
    # restart: always #this form  https://hub.docker.com/_/mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD : ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE : ${MARIADB_DATABASE}
      MARIADB_USER : ${MARIADB_USER}
      MARIADB_PASSWORD : ${MARIADB_PASSWORD}

    # ports:
    #   - "3306:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
  nginx:
    image: incep_nginx
    container_name: nginx
    restart: unless-stopped

    build: ./requirements/nginx
    ports:
      # - "80:80"
      - "443:443"
    depends_on:
      - wordpress
    environment:
        DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
  
  wordpress:
    image: incep_wordpress
    container_name: wordpress
    restart: unless-stopped

    build: ./requirements/wordpress
    depends_on:
      - mariadb
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      WP_USER: ${WP_USER}
      WP_USER_PASS: ${WP_USER_PASS}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASS: ${WP_ADMIN_PASS}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

# add to store the db and nginx in the locally and bind network
volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
networks:
  inception:
    driver: bridge

  
