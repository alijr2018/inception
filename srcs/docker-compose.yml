services:
  mariadb:
    # image: mariadb #this will download offical mriadb for docker hub
    build: ./requirement/mariadb # means Go into requirements/mariadb/ and build the image using the Dockerfile found there.
    # restart: always #this form  https://hub.docker.com/_/mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWOD : ${MARIADB_ROOT_PASSWOD}
      MARIADB_DATABASE : ${MARIADB_DATABASE}
      MARIADB_USER : ${MARIADB_USER}
      MARIADB_PASSWOD : ${MARIADB_PASSWOD}

    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
