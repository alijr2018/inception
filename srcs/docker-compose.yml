services:
  mariadb:
    image: mariadb:1.0
    container_name: mariadb
    build: ./requirements/mariadb
    restart: on-failure

    environment:
      DB_NAME : ${DB_NAME}
      DB_USER : ${DB_USER}
      DB_PASS : ${DB_PASS}

    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
  nginx:
    image: nginx:1.0
    container_name: nginx
    restart: on-failure

    build: ./requirements/nginx
    ports:
      - "443:443"
    depends_on:
      - wordpress

    environment:
        DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
  
  wordpress:
    image: wordpress:1.0
    container_name: wordpress
    restart: on-failure

    build: ./requirements/wordpress
    depends_on:
      - mariadb

    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      WP_USER: ${WP_USER}
      WP_USER_PASS: ${WP_USER_PASS}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASS: ${WP_ADMIN_PASS}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abrami/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/abrami/data/wordpress

      
networks:
  inception:
    driver: bridge

  
