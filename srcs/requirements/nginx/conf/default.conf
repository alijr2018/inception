server
{
    listen 443 ssl;
    root /var/www/html;
    server_name ${DOMAIN_NAME};
    index index.php;

    ssl_certificate /etc/nginx/ssl/we.crt;
    ssl_certificate_key /etc/nginx/ssl/we.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ \.php$
    {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
    }
}